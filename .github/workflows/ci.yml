name: FinAI2.0 CI & Anti-Fraud Quality Gates

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  gate-audit-and-tests:
    name: Six-Dimensional Gates & Regression Test Suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas pyarrow numpy requests

      - name: "Gate Check 1: Mother Library 370 Findings Guard"
        run: |
          python scripts/gates/tamper_guard.py --check-mother-library

      - name: "Gate Check 2: Evidence Integrity Audit (5/5 PASS)"
        run: |
          python scripts/audit_evidence_integrity.py

      - name: "Gate Check 3: Anti-Tamper & Governance Guard"
        run: |
          python scripts/gates/tamper_guard.py --verify-all

      - name: "Gate Check 4: Six-Dimensional Gate Master Audit"
        run: |
          python -m scripts.gates.gate_master_audit --strict

      - name: "Gate Check 5: Offline Pytest Regression Suite (100% PASS, >=699 passed)"
        run: |
          python -m pytest tests/ -p no:ddtrace -p no:ddtrace.pytest_bdd -v
