name: FinAI2.0 CI & Anti-Fraud Quality Gates

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  gate-audit-and-tests:
    name: Six-Dimensional Gates & Regression Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: .
      # 禁止自动加载本机插件（本地 ddtrace 缺 wrapt 时会拖垮 pytest；CI 未装 ddtrace 也更干净）
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Core Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "pandas>=2.0,<3" "pyarrow>=14" "numpy>=1.24,<3" requests
          python -c "import pytest,pandas,pyarrow,numpy,requests; print('deps ok', pytest.__version__, pandas.__version__, numpy.__version__)"
          python -c "import sys; print(sys.version); print('PYTHONPATH', __import__('os').environ.get('PYTHONPATH'))"

      - name: "Materialize CI minimal data sample (fixture → data/)"
        run: |
          set -euo pipefail
          # ⚠ 为什么需要这一步（2026-09-11 CI 红灯根因）：
          #   `data/**` 被 .gitignore 排除（数据资产不入库）⇒ CI 上**没有任何数据**。
          #   后果：D-1~D-4 判 INCONCLUSIVE、G-1 的 data_hash 失效、G-REF-1 报文档引用的
          #         data/dividend_stocks/ 与 data/daily_bars/ 为「不存在的仓内路径」⇒ --ci exit 1。
          #   处置：把版本库内的最小数据样本物化到数据区，使这些路径在 CI 上**真实存在**。
          #   ⛔ 这不是豁免、也不改任何门禁判据——门禁照常判定，只是终于有数据可判。
          SRC="tests/fixtures/ci_min_data"
          test -d "$SRC" || { echo "[CI] 缺少最小数据样本 $SRC"; exit 1; }
          mkdir -p data
          cp -r "$SRC/dividend_stocks" data/dividend_stocks
          cp -r "$SRC/daily_bars" data/daily_bars
          echo "[CI] 已物化最小数据样本 → data/dividend_stocks（$(find data/dividend_stocks -name '*.parquet' | wc -l) 个 parquet）、data/daily_bars"
          echo "[CI] ⚠ 注意：CI 上数据类门禁（D-1~D-4 / G-1 data_hash）校验的是**抽样小样**"
          echo "[CI]    ⛔ 不等于校验全量真实数据质量；全量校验须在本地 data/ 上跑同一条命令。"

      - name: "Gate Check 1: Mother Library 370 Findings Guard"
        run: |
          set -euo pipefail
          python scripts/gates/tamper_guard.py --check-mother-library

      - name: "Gate Check 2: Evidence Integrity Audit (5/5 PASS)"
        run: |
          set -euo pipefail
          python scripts/audit_evidence_integrity.py
          echo "audit_evidence_integrity exit=$?"

      - name: "Gate Check 3: Anti-Tamper & Governance Guard"
        run: |
          set -euo pipefail
          python scripts/gates/tamper_guard.py --verify-all

      - name: "Gate Check 4: Six-Dimensional Gate Master Audit (real repo ctx / CI policy)"
        run: |
          set -euo pipefail
          # ㉖：不再用空 context（会因需 run 产物的 INCONCLUSIVE 永久红）。
          # --ci 以仓库现状构造真实 ctx（与 pre_push 同源）：
          #   FAIL 或「静态可判门禁的 INCONCLUSIVE」⇒ exit=1；
          #   「需 run 产物门禁的 INCONCLUSIVE」⇒ 仅告警、不阻断。
          python -m scripts.gates.gate_master_audit --ci

      - name: "Gate Check 5: Adoption Gate (晋升留证 — 已采纳产物必须通过准入)"
        run: |
          set -euo pipefail
          # ㉜ 接线：仅对**已登记采纳**的产物强制准入（G-MDD-1 的 BLOCKER 归属地）。
          # experiments/acceptance/ 为空 ⇒ 无操作放行（⛔ 不阻断，否则 CI 因"尚未采纳"永久红）。
          python -m scripts.gates.adoption

      - name: "Gate Check 6: Offline Pytest Regression Suite (baseline = scripts/gates/constants.py)"
        run: |
          set -euo pipefail
          python -m pytest tests/ -q -p no:cacheprovider

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "==== python ===="
          python -V || true
          echo "==== pwd / top ===="
          pwd
          ls -la | head -40
          echo "==== finai/sources exists ===="
          test -d finai/sources && echo yes || echo no
          echo "==== FINDING count ===="
          python - <<'PY'
          from pathlib import Path
          n=0
          for p in Path('finai/sources').glob('**/*.py'):
              for line in p.read_text(encoding='utf-8', errors='ignore').splitlines():
                  if 'FINDING-' in line:
                      n+=1
          print('FINDING count', n)
          PY
